<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>플래피 버드 (Flappy Bird)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: #1a1a2e;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #fff;
        }

        #game-container {
            position: relative;
            width: 360px;
            height: 640px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            background-color: #70c5ce;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* 화면 오버레이 공통 스타일 */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(2px);
            text-align: center;
            padding: 20px;
            transition: opacity 0.3s ease;
        }

        .hidden {
            display: none !important;
        }

        h1 {
            font-size: 2.2rem;
            color: #fce300;
            text-shadow: 3px 3px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000;
            margin-bottom: 15px;
        }

        p {
            font-size: 1rem;
            margin-bottom: 25px;
            color: #f0f0f0;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);
            line-height: 1.4;
        }

        .score-board {
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            border-radius: 10px;
            padding: 15px 30px;
            margin-bottom: 25px;
            border: 3px solid #ded895;
            box-shadow: inset 0 0 5px rgba(0,0,0,0.2);
        }

        .score-board p {
            color: #333;
            text-shadow: none;
            font-size: 1.1rem;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .score-board p:last-child {
            margin-bottom: 0;
            color: #e67e22;
        }

        button {
            padding: 12px 28px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #fff;
            background-color: #e67e22;
            border: none;
            border-bottom: 4px solid #d35400;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: transform 0.1s, background-color 0.2s;
        }

        button:hover {
            background-color: #f39c12;
        }

        button:active {
            transform: translateY(2px);
            border-bottom-width: 2px;
        }

        /* 인게임 점수 표시 */
        #hud-score {
            position: absolute;
            top: 30px;
            width: 100%;
            text-align: center;
            font-size: 3rem;
            font-weight: 900;
            color: white;
            text-shadow: 3px 3px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000;
            pointer-events: none;
            z-index: 5;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- 메인 캔버스 -->
        <canvas id="gameCanvas" width="360" height="640"></canvas>

        <!-- 현재 점수 HUD -->
        <div id="hud-score" class="hidden">0</div>

        <!-- 1. 시작 화면 -->
        <div id="start-screen" class="overlay">
            <h1>플래피 버드</h1>
            <p>스페이스바를 누르거나<br>화면을 터치/클릭하여 날아오르세요!</p>
            <button id="start-btn">게임 시작</button>
        </div>

        <!-- 2. 게임 오버 화면 -->
        <div id="game-over-screen" class="overlay hidden">
            <h1>게임 오버</h1>
            <div class="score-board">
                <p>점수: <span id="final-score">0</span></p>
                <p>최고 점수: <span id="high-score">0</span></p>
            </div>
            <button id="restart-btn">다시 시작</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // UI 요소
        const startScreen = document.getElementById('start-screen');
        const gameOverScreen = document.getElementById('game-over-screen');
        const hudScore = document.getElementById('hud-score');
        const startBtn = document.getElementById('start-btn');
        const restartBtn = document.getElementById('restart-btn');
        const finalScoreEl = document.getElementById('final-score');
        const highScoreEl = document.getElementById('high-score');

        // 게임 상태관리: 'START', 'PLAYING', 'GAMEOVER'
        let gameState = 'START';
        let frames = 0;
        let score = 0;
        let highScore = parseInt(localStorage.getItem('flappy_bird_high_score')) || 0;

        // 환경 설정
        const GROUND_HEIGHT = 90;
        const PIPE_GAP = 130;
        const PIPE_WIDTH = 52;
        const PIPE_SPEED = 2;

        // 배경 구름 데이터
        const clouds = [
            { x: 50, y: 80, radius: 25 },
            { x: 200, y: 140, radius: 35 },
            { x: 300, y: 60, radius: 20 }
        ];

        // 새 객체
        const bird = {
            x: 80,
            y: 280,
            radius: 14,
            gravity: 0.35,
            jumpStrength: -6.8,
            velocity: 0,
            rotation: 0,

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);

                // 속도에 따른 회전각 계산
                if (gameState === 'PLAYING') {
                    this.rotation = Math.min(Math.PI / 4, Math.max(-Math.PI / 6, this.velocity * 0.08));
                }
                ctx.rotate(this.rotation);

                // 몸통 (노란색)
                ctx.beginPath();
                ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = '#fce300';
                ctx.fill();
                ctx.lineWidth = 2;
                ctx.strokeStyle = '#000';
                ctx.stroke();

                // 눈 (흰색 + 눈동자)
                ctx.beginPath();
                ctx.arc(6, -5, 5, 0, Math.PI * 2);
                ctx.fillStyle = '#fff';
                ctx.fill();
                ctx.stroke();

                ctx.beginPath();
                ctx.arc(8, -5, 2, 0, Math.PI * 2);
                ctx.fillStyle = '#000';
                ctx.fill();

                // 부리 (주황색)
                ctx.beginPath();
                ctx.moveTo(8, 2);
                ctx.lineTo(18, 5);
                ctx.lineTo(8, 10);
                ctx.closePath();
                ctx.fillStyle = '#ff6b6b';
                ctx.fill();
                ctx.stroke();

                // 날개 (주황빛 노란색)
                ctx.beginPath();
                ctx.ellipse(-5, 3, 7, 4, Math.PI / 6, 0, Math.PI * 2);
                ctx.fillStyle = '#f39c12';
                ctx.fill();
                ctx.stroke();

                ctx.restore();
            },

            update() {
                this.velocity += this.gravity;
                this.y += this.velocity;

                // 바닥 충돌 Check
                if (this.y + this.radius >= canvas.height - GROUND_HEIGHT) {
                    this.y = canvas.height - GROUND_HEIGHT - this.radius;
                    endGame();
                }

                // 천장 제한 Check
                if (this.y - this.radius <= 0) {
                    this.y = this.radius;
                    this.velocity = 0;
                }
            },

            jump() {
                this.velocity = this.jumpStrength;
            },

            reset() {
                this.y = 280;
                this.velocity = 0;
                this.rotation = 0;
            }
        };

        // 파이프 관리
        let pipes = [];

        class Pipe {
            constructor() {
                this.x = canvas.width;
                // 최소 높이를 보장하는 랜덤 위치 생성
                const minTop = 60;
                const maxTop = canvas.height - GROUND_HEIGHT - PIPE_GAP - 60;
                this.topHeight = Math.floor(Math.random() * (maxTop - minTop + 1)) + minTop;
                this.bottomY = this.topHeight + PIPE_GAP;
                this.passed = false;
            }

            draw() {
                ctx.fillStyle = '#73bf2e';
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 2;

                // 위 파이프
                ctx.fillRect(this.x, 0, PIPE_WIDTH, this.topHeight);
                ctx.strokeRect(this.x, 0, PIPE_WIDTH, this.topHeight);
                // 위 파이프 캡
                ctx.fillRect(this.x - 3, this.topHeight - 20, PIPE_WIDTH + 6, 20);
                ctx.strokeRect(this.x - 3, this.topHeight - 20, PIPE_WIDTH + 6, 20);

                // 아래 파이프
                const bottomHeight = canvas.height - GROUND_HEIGHT - this.bottomY;
                ctx.fillRect(this.x, this.bottomY, PIPE_WIDTH, bottomHeight);
                ctx.strokeRect(this.x, this.bottomY, PIPE_WIDTH, bottomHeight);
                // 아래 파이프 캡
                ctx.fillRect(this.x - 3, this.bottomY, PIPE_WIDTH + 6, 20);
                ctx.strokeRect(this.x - 3, this.bottomY, PIPE_WIDTH + 6, 20);
            }

            update() {
                this.x -= PIPE_SPEED;

                // 충돌 감지 (히트박스 계산)
                if (
                    bird.x + bird.radius > this.x &&
                    bird.x - bird.radius < this.x + PIPE_WIDTH
                ) {
                    if (
                        bird.y - bird.radius < this.topHeight ||
                        bird.y + bird.radius > this.bottomY
                    ) {
                        endGame();
                    }
                }

                // 점수 획득 감지
                if (!this.passed && this.x + PIPE_WIDTH < bird.x) {
                    this.passed = true;
                    score++;
                    hudScore.textContent = score;
                }
            }
        }

        // 배경(구름, 땅) 그리기
        function drawBackground() {
            // 구름 그리기
            ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
            clouds.forEach(cloud => {
                ctx.beginPath();
                ctx.arc(cloud.x, cloud.y, cloud.radius, 0, Math.PI * 2);
                ctx.arc(cloud.x + cloud.radius * 0.7, cloud.y - cloud.radius * 0.2, cloud.radius * 0.7, 0, Math.PI * 2);
                ctx.arc(cloud.x - cloud.radius * 0.7, cloud.y - cloud.radius * 0.2, cloud.radius * 0.7, 0, Math.PI * 2);
                ctx.fill();

                if (gameState === 'PLAYING') {
                    cloud.x -= 0.5;
                    if (cloud.x + cloud.radius < -50) {
                        cloud.x = canvas.width + 50;
                    }
                }
            });

            // 땅 그리기
            const groundY = canvas.height - GROUND_HEIGHT;
            ctx.fillStyle = '#ded895';
            ctx.fillRect(0, groundY, canvas.width, GROUND_HEIGHT);

            // 잔디 영역
            ctx.fillStyle = '#73bf2e';
            ctx.fillRect(0, groundY, canvas.width, 15);

            ctx.beginPath();
            ctx.moveTo(0, groundY + 15);
            ctx.lineTo(canvas.width, groundY + 15);
            ctx.lineWidth = 2;
            ctx.strokeStyle = '#000';
            ctx.stroke();

            // 땅 움직임 스트라이프 애니메이션
            ctx.fillStyle = '#c8b167';
            const offset = (frames * PIPE_SPEED) % 16;
            for (let x = -offset; x < canvas.width; x += 16) {
                ctx.fillRect(x, groundY + 16, 8, GROUND_HEIGHT - 16);
            }
        }

        // 메인 루프
        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            drawBackground();

            if (gameState === 'PLAYING') {
                bird.update();

                // 파이프 생성을 프레임 단위로 조절
                if (frames % 100 === 0) {
                    pipes.push(new Pipe());
                }

                // 파이프 업데이트 및 그리기
                for (let i = pipes.length - 1; i >= 0; i--) {
                    pipes[i].update();
                    pipes[i].draw();

                    // 화면 밖으로 나간 파이프 제거
                    if (pipes[i].x + PIPE_WIDTH < -10) {
                        pipes.splice(i, 1);
                    }
                }

                frames++;
            } else if (gameState === 'START') {
                // 시작 화면에서는 새가 둥실둥실 뜨도록 함
                bird.y = 280 + Math.sin(Date.now() / 200) * 6;
            }

            bird.draw();
            requestAnimationFrame(gameLoop);
        }

        // 게임 시작 액션
        function startGame() {
            gameState = 'PLAYING';
            score = 0;
            frames = 0;
            pipes = [];
            bird.reset();

            hudScore.textContent = score;
            startScreen.classList.add('hidden');
            gameOverScreen.classList.add('hidden');
            hudScore.classList.remove('hidden');
        }

        // 게임 오버 액션
        function endGame() {
            gameState = 'GAMEOVER';

            if (score > highScore) {
                highScore = score;
                localStorage.setItem('flappy_bird_high_score', highScore);
            }

            finalScoreEl.textContent = score;
            highScoreEl.textContent = highScore;

            hudScore.classList.add('hidden');
            gameOverScreen.classList.remove('hidden');
        }

        // 입력 처리 (스페이스바 / 클릭 / 터치)
        function handleInput(e) {
            if (e.type === 'keydown' && e.code !== 'Space') return;
            if (e.target.tagName === 'BUTTON') return; // 버튼 클릭 중복 실행 방지

            if (gameState === 'PLAYING') {
                bird.jump();
            }
        }

        window.addEventListener('keydown', handleInput);
        canvas.addEventListener('mousedown', handleInput);
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            handleInput(e);
        }, { passive: false });

        startBtn.addEventListener('click', startGame);
        restartBtn.addEventListener('click', startGame);

        // 최초 게임 루프 시작
        gameLoop();
    </script>
</body>
</html>
